name: Vorschau-Deploy für Pull Requests

# Jeder PR bekommt eine eigene Fly-App unter
# https://fahrzeug-protokolle-v2-pr-<Nummer>.fly.dev
# Beim Schließen des PR wird sie wieder zerstört.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Mehrere Pushes auf denselben PR: der neueste gewinnt, ältere Läufe werden
# abgebrochen. Anders als beim Produktiv-Deploy ist das hier erwünscht.
concurrency:
  group: fly-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Aus einem Fork heraus stellt GitHub keine Secrets bereit — ohne sie
      # entstünde ein Bundle ohne Supabase-Zugang. Lieber sauber aussteigen.
      - name: Fork-PR überspringen
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "PR kommt aus einem Fork – ohne Secrets ist kein Vorschau-Deploy möglich." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Setup Fly.io CLI
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Secrets prüfen
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}
        run: |
          missing=""
          for name in FLY_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_KEY VITE_APP_PASSWORD; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Fehlende Repository-Secrets:$missing" >&2
            echo "Anlegen unter Settings -> Secrets and variables -> Actions" >&2
            exit 1
          fi

      - name: Vorschau-App anlegen, falls noch nicht vorhanden
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Abweichende Fly-Organisation als Repository-Variable hinterlegen
          # (Settings -> Secrets and variables -> Actions -> Variables).
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          APP="fahrzeug-protokolle-v2-pr-${{ github.event.number }}"
          ORG="${FLY_ORG:-personal}"
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "App $APP existiert bereits."
          else
            echo "Lege App $APP in der Organisation $ORG an."
            if ! flyctl apps create "$APP" --org "$ORG"; then
              echo "Anlegen fehlgeschlagen. Stimmt die Organisation '$ORG'?" >&2
              echo "Falls nicht, unter Settings -> Variables die Variable FLY_ORG setzen." >&2
              exit 1
            fi
          fi

      - name: Deploy
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # Eine eigene PIN für Vorschauen ist optional: ist das Secret
        # VITE_APP_PASSWORD_PREVIEW nicht gesetzt, gilt die produktive.
        run: >-
          flyctl deploy --remote-only
          --config fly.preview.toml
          --app "fahrzeug-protokolle-v2-pr-${{ github.event.number }}"
          --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          --build-arg VITE_SUPABASE_KEY=${{ secrets.VITE_SUPABASE_KEY }}
          --build-arg VITE_APP_PASSWORD=${{ secrets.VITE_APP_PASSWORD_PREVIEW || secrets.VITE_APP_PASSWORD }}

      - name: URL an den PR schreiben
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://fahrzeug-protokolle-v2-pr-${{ github.event.number }}.fly.dev"
          echo "Vorschau: $URL" >> "$GITHUB_STEP_SUMMARY"
          BODY=$(printf '%s\n' \
            "**Vorschau bereit:** $URL" \
            "" \
            "Stand: \`${{ github.event.pull_request.head.sha }}\`" \
            "" \
            "Die Vorschau greift auf **dieselbe Supabase-Datenbank** zu wie die" \
            "produktive App — hier angelegte Daten sind echt. Nach ein paar" \
            "Minuten ohne Zugriff fährt die App herunter, der nächste Aufruf" \
            "dauert dann etwas länger." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")
          # Bei jedem Push denselben Kommentar aktualisieren statt neue anzuhängen
          gh pr comment "${{ github.event.number }}" --body "$BODY" --edit-last \
            || gh pr comment "${{ github.event.number }}" --body "$BODY"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Vorschau-App zerstören
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="fahrzeug-protokolle-v2-pr-${{ github.event.number }}"
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            flyctl apps destroy "$APP" --yes
            echo "App $APP zerstört." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Keine Vorschau-App $APP vorhanden." >> "$GITHUB_STEP_SUMMARY"
          fi
