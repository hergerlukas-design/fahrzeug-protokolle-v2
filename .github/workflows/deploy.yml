name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  # Erlaubt einen Deploy von Hand über den Actions-Tab, ohne neuen Commit
  workflow_dispatch:

# Zwei gleichzeitige Deploys würden sich gegenseitig überholen — der neuere
# wartet, statt den laufenden abzubrechen.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Der neueste Stand von main, nicht der auslösende Commit: ein wartender
      # Lauf soll auf dem Version-Commit des vorigen aufsetzen.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # Jeder Push auf main ist ein Deploy und bekommt eine neue Patch-Version,
      # damit die Einstellungen zeigen, welcher Stand läuft. Der Push mit dem
      # GITHUB_TOKEN löst keinen weiteren Deploy aus; [skip ci] sichert das
      # zusätzlich ab. Ein Deploy von Hand behält die Version. Klappt der Push
      # nicht (z. B. Branch-Schutz), wird trotzdem deployt.
      - name: Version erhöhen
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Version $VERSION [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Fehlt ein Secret, würde flyctl ein Bundle ohne Supabase-Zugang und
      # ohne PIN bauen — lieber hier mit klarer Meldung abbrechen.
      - name: Secrets prüfen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}
        run: |
          missing=""
          for name in FLY_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_KEY VITE_APP_PASSWORD; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Fehlende Repository-Secrets:$missing" >&2
            echo "Anlegen unter Settings -> Secrets and variables -> Actions" >&2
            exit 1
          fi

      # Die VITE_*-Werte werden in das Client-Bundle kompiliert und stehen
      # deshalb bewusst nicht in der fly.toml, sondern in den Repository-Secrets.
      - name: Deploy
        run: >-
          flyctl deploy --remote-only
          --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          --build-arg VITE_SUPABASE_KEY=${{ secrets.VITE_SUPABASE_KEY }}
          --build-arg VITE_APP_PASSWORD=${{ secrets.VITE_APP_PASSWORD }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
