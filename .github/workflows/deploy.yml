name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  # Erlaubt einen Deploy von Hand über den Actions-Tab, ohne neuen Commit
  workflow_dispatch:

# Zwei gleichzeitige Deploys würden sich gegenseitig überholen — der neuere
# wartet, statt den laufenden abzubrechen.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Die VITE_*-Build-Args stehen in der fly.toml und werden von
      # flyctl automatisch an den Docker-Build übergeben.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
